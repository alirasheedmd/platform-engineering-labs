---
- name: Deploy Swarm lab services
  hosts: swarm_managers
  become: true
  vars_files:
    - ../vars/lab.yml

  tasks:
    - name: Check if platform overlay exists
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - platform-overlay
      register: overlay_check
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Create platform overlay network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - --driver
          - overlay
          - --attachable
          - --subnet
          - 10.0.1.0/24
          - platform-overlay
      when: overlay_check.rc != 0

    - name: Read the deployed application image
      community.docker.docker_swarm_service_info:
        name: lab-web
      register: lab_web_check

    - name: Converge private lab-web without replacing an existing release
      community.docker.docker_swarm_service:
        name: lab-web
        image: >-
          {{ lab_web_check.service.Spec.TaskTemplate.ContainerSpec.Image
             if lab_web_check.exists else lab_nginx_image }}
        resolve_image: false
        replicas: "{{ lab_web_replicas }}"
        networks:
          - platform-overlay
        publish: []
        state: present
