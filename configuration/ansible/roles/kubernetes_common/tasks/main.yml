---
- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_facts["swaptotal_mb"] > 0

- name: Disable swap persistently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*)([^#\n]+\s+)(\S+\s+)(swap\s+)(.*)$'
    replace: '# \1\2\3\4\5'
  when: ansible_facts["swaptotal_mb"] > 0

- name: Enable IPv4 forwarding for Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  register: kubernetes_sysctl

- name: Apply Kubernetes sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  when: kubernetes_sysctl.changed
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate default containerd configuration
  ansible.builtin.command:
    cmd: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Write containerd configuration with systemd cgroups
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: >-
      {{
        containerd_default_config.stdout
        | regex_replace(
            'SystemdCgroup = false',
            'SystemdCgroup = true'
          )
      }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true
- name: Install packages required for Kubernetes repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: "0644"

- name: Convert Kubernetes repository key to GPG keyring
  ansible.builtin.shell:
    cmd: >
      gpg --dearmor
      --yes
      --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /tmp/kubernetes-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Configure Kubernetes APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /
    owner: root
    group: root
    mode: "0644"

- name: Refresh APT cache for Kubernetes repository
  ansible.builtin.apt:
    update_cache: true
- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
