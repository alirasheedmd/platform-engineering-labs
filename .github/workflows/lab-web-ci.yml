name: Lab Web CI

on:
  push:
    branches:
      - main
    paths:
      - "applications/lab-web/**"
      - ".github/workflows/lab-web-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "applications/lab-web/**"
      - ".github/workflows/lab-web-ci.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alirasheedmd/platform-lab-web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate application files
        run: |
          test -f applications/lab-web/Dockerfile
          test -f applications/lab-web/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: applications/lab-web
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Show image digest
        if: github.event_name == 'push'
        run: echo "Published digest ${{ steps.build.outputs.digest }}"
